<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8fb8c" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Soft Aura Rings -->
  <circle cx="250" cy="250" r="220" fill="#eff6ff" />
  <circle cx="250" cy="250" r="175" fill="#dbeafe" opacity="0.6" />
  <circle cx="250" cy="250" r="130" fill="#bfdbfe" opacity="0.5" />

  <!-- Center Floating Student Silhouette & Workspace -->
  <g filter="url(#softShadow)">
    <!-- Base Desk / Laptop Container -->
    <rect x="90" y="320" width="320" height="110" rx="20" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Code / Screen Lines on Floating Dashboard -->
    <rect x="115" y="345" width="120" height="10" rx="5" fill="#3b82f6" />
    <rect x="115" y="365" width="80" height="8" rx="4" fill="#94a3b8" />
    <rect x="115" y="382" width="100" height="8" rx="4" fill="#cbd5e1" />

    <!-- Barter Swap Interactive Bubble on screen -->
    <rect x="260" y="340" width="130" height="58" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="272" y="360" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#15803d">SKILL MATCHED</text>
    <text x="272" y="380" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a">UI/UX ⇄ PHP</text>
  </g>

  <!-- Student Character Art -->
  <g filter="url(#softShadow)">
    <!-- Body & Hoodie -->
    <path d="M170 320 C170 230, 330 230, 330 320 Z" fill="url(#bgGrad)" />
    <!-- Collar -->
    <path d="M225 240 Q250 260 275 240 Q250 275 225 240 Z" fill="#ffffff" opacity="0.9" />

    <!-- Head & Neck -->
    <rect x="236" y="215" width="28" height="35" rx="6" fill="#fbcfe8" />
    <ellipse cx="250" cy="175" rx="46" ry="54" fill="#fed7aa" />

    <!-- Modern Hair & Cap -->
    <path d="M198 165 C200 115, 295 110, 302 165 C295 140, 275 130, 250 132 C225 130, 205 142, 198 165 Z" fill="#1e293b" />
    <path d="M200 150 C210 120, 280 120, 298 150 C265 140, 230 140, 200 150 Z" fill="#0f172a" />

    <!-- Friendly Spectacles / Glasses -->
    <rect x="220" y="165" width="24" height="18" rx="6" fill="none" stroke="#1e293b" stroke-width="3" />
    <rect x="256" y="165" width="24" height="18" rx="6" fill="none" stroke="#1e293b" stroke-width="3" />
    <line x1="244" y1="174" x2="256" y2="174" stroke="#1e293b" stroke-width="3" />

    <!-- Smile -->
    <path d="M242 196 Q250 203 258 196" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Floating Bento Badges Around Student -->
  <g filter="url(#softShadow)">
    <!-- Badge 1: 5.0 Star Rating -->
    <rect x="50" y="110" width="135" height="48" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="74" cy="134" r="14" fill="#fef08a" />
    <polygon points="74,126 77,132 84,133 79,137 80,143 74,140 68,143 69,137 64,133 71,132" fill="#ca8a04" />
    <text x="96" y="132" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a">4.9 / 5.0</text>
    <text x="96" y="146" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b">Verified Peer</text>

    <!-- Badge 2: 100% Free / Peer Learning -->
    <rect x="315" y="80" width="145" height="52" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="342" cy="106" r="14" fill="#dcfce7" />
    <path d="M336 106 L340 110 L349 101" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="364" y="104" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a">SDG 4 Impact</text>
    <text x="364" y="118" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#16a34a">Bebas Biaya 100%</text>

    <!-- Badge 3: Fast Matching Notification -->
    <rect x="330" y="240" width="130" height="44" rx="22" fill="#0f172a" />
    <circle cx="352" cy="262" r="10" fill="#3b82f6" />
    <text x="352" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">⇄</text>
    <text x="372" y="267" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Instant Swap</text>
  </g>
</svg>
